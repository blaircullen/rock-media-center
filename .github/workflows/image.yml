name: Image

# Builds the Docker image the way update.sh does on the owner's server, without
# publishing it. A broken apt repository or base image then
# fails here, on the PR, instead of half-way through an update on the server.
# Publishing is release.yml's job, and only for a pushed v* tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # push: false and no load: the image stays in the build cache, which is all a check
      # needs. Layers are cached in GitHub's cache, so a run that changes only Go or web
      # code skips the apt layers.
      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.head_ref || github.ref_name }}-${{ github.sha }}
            COMMIT=${{ github.sha }}
